<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Étoile · Suivi Streetlifting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15181C; --surface:#1E232A; --surface-2:#262C34; --line:#333B44;
  --ink:#EAEDF0; --muted:#8A939E; --faint:#5C6470;
  --accent:#EF4136;            /* rouge disque 25 kg */
  --accent-dim:#3a1c1a;
  --force:#EF4136; --hyp:#4C86C6; --renfo:#5FA88C;
  --display:'Oswald','Arial Narrow',system-ui,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);}
body{max-width:520px;margin:0 auto;padding:0 0 96px;min-height:100vh;}
button,input{font-family:inherit;color:inherit;}

/* Header */
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 70%,rgba(21,24,28,0));padding:16px 16px 8px;}
.brand{display:flex;align-items:baseline;justify-content:space-between;}
.brand h1{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase;}
.brand h1 span{color:var(--accent);}
.wk{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.05em;}
.prog-name{font-size:12px;color:var(--muted);margin-top:2px;letter-spacing:.02em;}

/* Day selector */
.days{display:flex;gap:6px;margin-top:14px;overflow-x:auto;padding-bottom:2px;}
.day{flex:0 0 auto;min-width:46px;text-align:center;padding:8px 4px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);cursor:pointer;transition:.15s;}
.day .dn{font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.day .dt{font-size:9px;color:var(--faint);margin-top:2px;text-transform:uppercase;letter-spacing:.05em;}
.day.active{border-color:var(--accent);background:var(--accent-dim);}
.day.active .dn{color:var(--ink);}
.day.today .dn{color:var(--accent);}
.day.rest{opacity:.5;}

/* View */
#view{padding:8px 16px 0;}
.session-title{font-family:var(--display);font-size:15px;letter-spacing:.06em;text-transform:uppercase;
  margin:16px 0 4px;color:var(--ink);}
.sec-title{font-family:var(--display);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--faint);margin:18px 0 8px;display:flex;align-items:center;gap:8px;}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line);}

/* Exercise card */
.exo{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
.exo-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.exo-name{font-weight:600;font-size:15px;line-height:1.25;}
.exo-meta{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap;}
.chip{font-family:var(--display);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted);}
.chip.force{color:var(--force);border-color:#5a2420;}
.chip.hyp{color:var(--hyp);border-color:#274158;}
.chip.renfo{color:var(--renfo);border-color:#2c5546;}
.chip.target{color:var(--ink);border-color:var(--line);font-family:var(--mono);letter-spacing:0;}
.rest-btn{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface-2);
  border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;white-space:nowrap;}
.rest-btn:active{border-color:var(--accent);color:var(--ink);}
.last{font-size:11px;color:var(--faint);font-family:var(--mono);margin-top:8px;}

/* Set rows */
.sets{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
.set-row{display:grid;grid-template-columns:24px 1fr 1fr;gap:8px;align-items:center;}
.set-n{font-family:var(--display);font-size:13px;color:var(--faint);text-align:center;}
.inp{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;
  font-family:var(--mono);font-size:15px;text-align:center;width:100%;}
.inp:focus{outline:none;border-color:var(--accent);}
.inp::placeholder{color:var(--faint);}
.exo-actions{display:flex;gap:8px;margin-top:10px;}
.save{flex:1;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:10px;
  font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;}
.save.saved{background:var(--renfo);}
.save:active{transform:translateY(1px);}

/* Generic */
.rest-day{text-align:center;color:var(--muted);padding:48px 16px;}
.rest-day .big{font-family:var(--display);font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;}
.row{display:flex;gap:8px;align-items:center;}
.btn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 14px;
  cursor:pointer;font-size:14px;}
.btn.primary{background:var(--accent);color:#fff;border:none;font-family:var(--display);
  letter-spacing:.08em;text-transform:uppercase;font-size:13px;}
.muted{color:var(--muted);font-size:13px;}
.empty{text-align:center;color:var(--faint);padding:40px 16px;font-size:14px;}

/* Progression */
.exo-pick{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:12px;color:var(--ink);font-size:15px;margin-bottom:12px;}
.hist-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
.hist-row .d{color:var(--muted);font-family:var(--mono);}
.hist-row .v{font-family:var(--mono);}
.hist-row .pr{color:var(--accent);}

/* Muscle-up gauge */
.mu-wrap{display:flex;gap:18px;align-items:stretch;}
.gauge{position:relative;width:56px;flex:0 0 auto;border-radius:12px;
  background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);overflow:hidden;}
.gauge-fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--accent),var(--accent-dim));
  transition:height .5s cubic-bezier(.2,.8,.2,1);}
.gauge-marker{position:absolute;left:50%;transform:translateX(-50%);bottom:0;
  font-size:22px;transition:bottom .5s cubic-bezier(.2,.8,.2,1);z-index:2;}
.stages{flex:1;display:flex;flex-direction:column-reverse;gap:0;}
.stage{padding:10px 12px;border-left:2px solid var(--line);cursor:pointer;position:relative;}
.stage .s-name{font-size:14px;font-weight:600;}
.stage .s-sub{font-size:11px;color:var(--faint);margin-top:1px;}
.stage.reached{border-left-color:var(--accent);}
.stage.reached .s-name{color:var(--ink);}
.stage.current{background:var(--accent-dim);border-left-color:var(--accent);}
.stage.locked .s-name{color:var(--muted);}

/* Bodyweight */
.bw-add{display:flex;gap:8px;margin-bottom:14px;}
.bw-add .inp{flex:1;}
.spark{width:100%;height:60px;margin:6px 0 12px;}

/* Timer bar */
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:40;
  background:var(--accent);color:#fff;border-radius:30px;padding:12px 22px;display:none;
  align-items:center;gap:14px;box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:90vw;}
#timer.show{display:flex;}
#timer .t{font-family:var(--mono);font-size:22px;font-weight:600;min-width:58px;text-align:center;}
#timer button{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;}

/* Bottom nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:flex;max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);}
nav button{flex:1;background:none;border:none;padding:11px 4px 12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);}
nav button.on{color:var(--accent);}
nav .ic{font-size:19px;line-height:1;}
nav .lb{font-family:var(--display);font-size:10px;letter-spacing:.08em;text-transform:uppercase;}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Étoile<span>.</span></h1>
    <div class="wk" id="week">—</div>
  </div>
  <div class="prog-name" id="progName"></div>
  <div class="days" id="days"></div>
</header>

<main id="view"></main>

<div id="timer">
  <span class="t" id="timerT">0:00</span>
  <button id="timerAdd">+30s</button>
  <button id="timerStop">Stop</button>
</div>

<nav>
  <button data-tab="seance" class="on"><span class="ic">🏋️</span><span class="lb">Séance</span></button>
  <button data-tab="prog"><span class="ic">📈</span><span class="lb">Progression</span></button>
  <button data-tab="mu"><span class="ic">🎯</span><span class="lb">Muscle-up</span></button>
  <button data-tab="poids"><span class="ic">⚖️</span><span class="lb">Poids</span></button>
</nav>

<script>
/* ============ DONNÉES DU PROGRAMME (statique) ============ */
var PROGRAM = {
  name: "Streetlifting · Objectif Muscle-up",
  days: [
    {day:'Lun', sid:'j1'}, {day:'Mar', sid:'j2'}, {day:'Mer', sid:'j3'},
    {day:'Jeu', sid:'j4'}, {day:'Ven', sid:'j5'}, {day:'Sam', sid:null}, {day:'Dim', sid:null}
  ],
  sessions: {
    j1:{name:"J1 · Traction lourde + Puissance", sections:[
      {title:"Force tirage", ex:[
        {n:"Traction lestée", s:5, r:"3", rest:180, o:"force"},
        {n:"Traction explosive (viser plus bas)", s:5, r:"3", rest:120, o:"force"}
      ]},
      {title:"Accessoires", ex:[
        {n:"Rowing barre", s:3, r:"8", rest:90, o:"hyp"},
        {n:"Curl biceps", s:3, r:"10-12", rest:75, o:"hyp"},
        {n:"Gainage anti-extension", s:3, r:"30-45s", rest:60, o:"renfo"}
      ]}
    ]},
    j2:{name:"J2 · Squat lourd", sections:[
      {title:"Activation genou", ex:[
        {n:"Step-down lent", s:2, r:"6/j", rest:0, o:"renfo"},
        {n:"Terminal knee extension", s:2, r:"12", rest:0, o:"renfo"}
      ]},
      {title:"Force", ex:[
        {n:"Squat barre", s:5, r:"3", rest:210, o:"force"},
        {n:"Front squat / squat pause", s:3, r:"5", rest:150, o:"force"}
      ]},
      {title:"Accessoires", ex:[
        {n:"Soulevé de terre roumain", s:3, r:"8", rest:90, o:"hyp"},
        {n:"Extension lombaire", s:3, r:"12-15", rest:60, o:"renfo"},
        {n:"Mollets", s:3, r:"12-15", rest:90, o:"renfo"},
        {n:"Pallof anti-rotation", s:3, r:"10/c", rest:60, o:"renfo"}
      ]}
    ]},
    j3:{name:"J3 · Dip lourd + Poussée", sections:[
      {title:"Force poussée", ex:[
        {n:"Dips lestés", s:5, r:"3", rest:180, o:"force"},
        {n:"Straight bar dips", s:3, r:"6-8", rest:120, o:"force"}
      ]},
      {title:"Accessoires", ex:[
        {n:"Développé militaire debout", s:3, r:"6", rest:120, o:"hyp"},
        {n:"Extension triceps", s:3, r:"10-12", rest:75, o:"hyp"},
        {n:"Élévations latérales", s:3, r:"12-15", rest:60, o:"hyp"}
      ]}
    ]},
    j4:{name:"J4 · Muscle-up : Puissance + Transition", sections:[
      {title:"Puissance de tirage (à froid)", ex:[
        {n:"Traction explosive au plus haut", s:6, r:"2-3", rest:150, o:"force"}
      ]},
      {title:"Transition muscle-up", ex:[
        {n:"Négatives de MU (3-5s)", s:4, r:"3", rest:120, o:"force"}
      ]},
      {title:"Volume", ex:[
        {n:"Traction lestée", s:4, r:"6", rest:120, o:"hyp"},
        {n:"Face pull", s:3, r:"12-15", rest:75, o:"hyp"},
        {n:"Hollow hold", s:3, r:"20-30s", rest:60, o:"renfo"}
      ]}
    ]},
    j5:{name:"J5 · Squat + Dip volume + Postérieur", sections:[
      {title:"Activation genou", ex:[
        {n:"Step-down lent", s:2, r:"6/j", rest:0, o:"renfo"},
        {n:"Pogo hops", s:2, r:"15", rest:0, o:"renfo"}
      ]},
      {title:"Force / Volume", ex:[
        {n:"Squat barre", s:4, r:"6", rest:120, o:"hyp"},
        {n:"Dips lestés", s:4, r:"8", rest:90, o:"hyp"}
      ]},
      {title:"Accessoires", ex:[
        {n:"Fente bulgare", s:3, r:"8/j", rest:90, o:"hyp"},
        {n:"Leg curl / Nordic", s:3, r:"6-8", rest:90, o:"hyp"},
        {n:"Bird-dog", s:3, r:"8/c", rest:45, o:"renfo"},
        {n:"Gainage latéral", s:3, r:"30s/c", rest:60, o:"renfo"}
      ]}
    ]}
  }
};

var MU_STAGES = [
  {name:"Menton à la barre", sub:"Traction stricte complète"},
  {name:"Gorge à la barre", sub:"Tu tires plus haut"},
  {name:"Haut de poitrine", sub:"La hauteur monte"},
  {name:"Sternum", sub:"Prêt pour la transition"},
  {name:"MU assisté", sub:"Élastique / sauté"},
  {name:"Muscle-up strict", sub:"Objectif atteint"}
];

var OBJ = {force:"Force", hyp:"Hypertrophie", renfo:"Renfo"};

/* ============ STOCKAGE ============ */
var KEY = "etoile_solo_v1";
var D = load();
var TAB = "seance";
var SEL_DAY = todayIdx();
var PROG_EX = null; // exercice sélectionné en progression

function load(){
  var d;
  try{ d = JSON.parse(localStorage.getItem(KEY)); }catch(e){ d = null; }
  if(!d){ d = {startDate: today(), logs:{}, bw:[], mu:{stage:0, logs:[]}, _migrated:false}; }
  d.logs = d.logs || {}; d.bw = d.bw || []; d.mu = d.mu || {stage:0, logs:[]};
  if(!d.startDate) d.startDate = today();
  if(!d._migrated){ migrateOld(d); d._migrated = true; save(d); }
  return d;
}
function save(d){ try{ localStorage.setItem(KEY, JSON.stringify(d||D)); }catch(e){} }

/* Récupère les perfs de l'ancienne app une seule fois */
function migrateOld(d){
  try{
    var raw = localStorage.getItem("florian_training_v1");
    if(!raw) return;
    var old = JSON.parse(raw);
    if(old && old.exHistory){
      Object.keys(old.exHistory).forEach(function(name){
        var weeks = old.exHistory[name];
        Object.keys(weeks).forEach(function(wkk){
          var rec = weeks[wkk];
          if(!rec || !rec.sets) return;
          var sets = rec.sets.filter(function(x){return x && (x.poids!=null || x.reps!=null);})
            .map(function(x){return {kg:Number(x.poids)||0, reps:Number(x.reps)||0};});
          if(!sets.length) return;
          if(!d.logs[name]) d.logs[name] = [];
          d.logs[name].push({date: rec.date || ("S"+wkk), sets:sets, imported:true});
        });
      });
    }
    if(old && old.bodyWeight){ d.bw.push({date: today(), kg: Number(old.bodyWeight)||0}); }
  }catch(e){}
}

/* ============ UTILITAIRES ============ */
function today(){ var n=new Date(); return n.getFullYear()+"-"+p2(n.getMonth()+1)+"-"+p2(n.getDate()); }
function p2(x){ return (x<10?"0":"")+x; }
function todayIdx(){ var g=new Date().getDay(); return g===0?6:g-1; } // Lun=0 ... Dim=6
function weekNum(){
  var s=new Date(D.startDate), n=new Date(today());
  var diff=Math.floor((n-s)/(1000*60*60*24));
  return Math.max(1, Math.floor(diff/7)+1);
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function fmtRest(sec){ var m=Math.floor(sec/60), s=sec%60; return m+":"+p2(s); }
function fmtDate(d){ if(/^S\d/.test(d)) return d; var p=d.split("-"); return p.length===3?(p[2]+"/"+p[1]):d; }
function topSet(entry){ // meilleure charge de la séance
  var m=0; (entry.sets||[]).forEach(function(x){ if((x.kg||0)>m) m=x.kg; }); return m;
}

/* ============ RENDER ============ */
function renderHeader(){
  document.getElementById("week").textContent = "Semaine " + weekNum();
  document.getElementById("progName").textContent = PROGRAM.name;
  var html = PROGRAM.days.map(function(d,i){
    var rest = !d.sid;
    var cls = "day" + (i===SEL_DAY?" active":"") + (i===todayIdx()?" today":"") + (rest?" rest":"");
    return '<div class="'+cls+'" onclick="selDay('+i+')"><div class="dn">'+d.day+'</div>'+
           '<div class="dt">'+(rest?"repos":(d.sid.toUpperCase()))+'</div></div>';
  }).join("");
  document.getElementById("days").innerHTML = html;
}

function render(){
  renderHeader();
  document.querySelectorAll("nav button").forEach(function(b){ b.classList.toggle("on", b.dataset.tab===TAB); });
  var v = document.getElementById("view");
  if(TAB==="seance") v.innerHTML = viewSeance();
  else if(TAB==="prog") v.innerHTML = viewProg();
  else if(TAB==="mu") v.innerHTML = viewMU();
  else if(TAB==="poids") v.innerHTML = viewPoids();
}

/* ---- Séance ---- */
function viewSeance(){
  var day = PROGRAM.days[SEL_DAY];
  if(!day.sid) return '<div class="rest-day"><div class="big">Repos</div><p class="muted" style="margin-top:8px">Récupération. Le muscle-up se construit aussi hors barre.</p></div>';
  var sess = PROGRAM.sessions[day.sid];
  var h = '<div class="session-title">'+esc(sess.name)+'</div>';
  sess.sections.forEach(function(sec){
    h += '<div class="sec-title">'+esc(sec.title)+'</div>';
    sec.ex.forEach(function(ex){ h += exoCard(ex); });
  });
  return h;
}

function exoCard(ex){
  var id = "exo_" + slug(ex.n);
  var last = lastLog(ex.n);
  var lastStr = "";
  if(last){
    lastStr = '<div class="last">Dernier ('+fmtDate(last.date)+') · '+
      last.sets.map(function(s){return (s.kg||0)+"kg×"+(s.reps||0);}).join("  ") + '</div>';
  }
  var rows = "";
  for(var i=0;i<ex.s;i++){
    var pv = last && last.sets[i] ? last.sets[i] : null;
    rows += '<div class="set-row"><div class="set-n">'+(i+1)+'</div>'+
      '<input class="inp" type="number" inputmode="decimal" placeholder="kg" value="'+(pv?(pv.kg||""):"")+'" data-k="kg">'+
      '<input class="inp" type="number" inputmode="numeric" placeholder="reps" value="'+(pv?(pv.reps||""):"")+'" data-k="reps"></div>';
  }
  var restChip = ex.rest>0 ? '<button class="rest-btn" onclick="startTimer('+ex.rest+')">⏱ '+fmtRest(ex.rest)+'</button>' : '';
  return '<div class="exo" id="'+id+'" data-name="'+esc(ex.n)+'">'+
    '<div class="exo-head"><div style="flex:1"><div class="exo-name">'+esc(ex.n)+'</div>'+
      '<div class="exo-meta"><span class="chip target">'+ex.s+'×'+esc(ex.r)+'</span>'+
      '<span class="chip '+ex.o+'">'+OBJ[ex.o]+'</span></div></div>'+restChip+'</div>'+
    lastStr+
    '<div class="sets">'+rows+'</div>'+
    '<div class="exo-actions"><button class="save" onclick="saveExo(\''+id+'\')">Enregistrer</button></div></div>';
}

function saveExo(id){
  var card = document.getElementById(id);
  var name = card.dataset.name;
  var rows = card.querySelectorAll(".set-row");
  var sets = [];
  rows.forEach(function(r){
    var kg = r.querySelector('[data-k=kg]').value;
    var reps = r.querySelector('[data-k=reps]').value;
    if(kg!=="" || reps!==""){ sets.push({kg:Number(kg)||0, reps:Number(reps)||0}); }
  });
  if(!sets.length){ return; }
  if(!D.logs[name]) D.logs[name] = [];
  D.logs[name].push({date: today(), sets:sets});
  save();
  var btn = card.querySelector(".save");
  btn.textContent = "Enregistré ✓"; btn.classList.add("saved");
  setTimeout(function(){ btn.textContent="Enregistrer"; btn.classList.remove("saved"); }, 1400);
}

/* ---- Progression ---- */
function viewProg(){
  var names = Object.keys(D.logs).filter(function(n){return D.logs[n].length;});
  if(!names.length) return '<div class="empty">Aucune perf enregistrée pour l\'instant.<br>Note tes séries dans l\'onglet Séance.</div>';
  names.sort();
  if(!PROG_EX || names.indexOf(PROG_EX)===-1) PROG_EX = names[0];
  var opts = names.map(function(n){return '<option value="'+esc(n)+'"'+(n===PROG_EX?" selected":"")+'>'+esc(n)+'</option>';}).join("");
  var h = '<select class="exo-pick" onchange="pickProg(this.value)">'+opts+'</select>';
  var entries = D.logs[PROG_EX].slice();
  h += chart(entries);
  var best = 0; entries.forEach(function(e){ best = Math.max(best, topSet(e)); });
  h += '<div class="card"><div class="muted" style="margin-bottom:6px">Historique — '+esc(PROG_EX)+'</div>';
  entries.slice().reverse().forEach(function(e){
    var ts = topSet(e); var pr = ts===best && best>0;
    h += '<div class="hist-row"><span class="d">'+fmtDate(e.date)+'</span>'+
      '<span class="v'+(pr?" pr":"")+'">'+e.sets.map(function(s){return (s.kg||0)+"×"+(s.reps||0);}).join("  ")+(pr?"  ★":"")+'</span></div>';
  });
  h += '</div>';
  return h;
}
function pickProg(v){ PROG_EX = v; render(); }

function chart(entries){
  var pts = entries.map(function(e){return topSet(e);});
  if(pts.length<2) return '<div class="card muted">Au moins 2 séances pour voir la courbe.</div>';
  var w=460, hgt=140, pad=24;
  var mn=Math.min.apply(null,pts), mx=Math.max.apply(null,pts);
  if(mx===mn) mx=mn+1;
  var n=pts.length;
  var xs=function(i){return pad+(w-2*pad)*(n===1?0:i/(n-1));};
  var ys=function(v){return pad+(hgt-2*pad)*(1-(v-mn)/(mx-mn));};
  var line=pts.map(function(v,i){return (i?"L":"M")+xs(i).toFixed(1)+" "+ys(v).toFixed(1);}).join(" ");
  var dots=pts.map(function(v,i){return '<circle cx="'+xs(i).toFixed(1)+'" cy="'+ys(v).toFixed(1)+'" r="3" fill="var(--accent)"/>';}).join("");
  return '<div class="card"><div class="muted" style="margin-bottom:4px">Charge max par séance (kg)</div>'+
    '<svg class="spark" viewBox="0 0 '+w+' '+hgt+'" preserveAspectRatio="none" style="height:150px">'+
    '<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2"/>'+dots+
    '<text x="'+pad+'" y="14" fill="var(--faint)" font-size="11" font-family="monospace">'+mx+'</text>'+
    '<text x="'+pad+'" y="'+(hgt-6)+'" fill="var(--faint)" font-size="11" font-family="monospace">'+mn+'</text>'+
    '</svg></div>';
}

/* ---- Muscle-up ---- */
function viewMU(){
  var cur = D.mu.stage;
  var pct = (cur/(MU_STAGES.length-1))*100;
  var stagesH = MU_STAGES.map(function(st,i){
    var cls = "stage" + (i<cur?" reached":"") + (i===cur?" current":"") + (i>cur?" locked":"");
    return '<div class="'+cls+'" onclick="setMU('+i+')"><div class="s-name">'+esc(st.name)+'</div>'+
      '<div class="s-sub">'+esc(st.sub)+'</div></div>';
  }).join("");
  var h = '<div class="card"><div class="muted" style="margin-bottom:12px">Ta hauteur de tirage actuelle — touche un palier pour la mettre à jour.</div>'+
    '<div class="mu-wrap"><div class="gauge">'+
      '<div class="gauge-fill" style="height:'+pct+'%"></div>'+
      '<div class="gauge-marker" style="bottom:calc('+pct+'% - 11px)">🧗</div>'+
    '</div><div class="stages">'+stagesH+'</div></div></div>';
  h += '<div class="card"><div class="muted">Rappel des phases</div>'+
    '<p style="font-size:13px;margin-top:8px;line-height:1.5">1. Atteindre le <b>sternum</b> en traction explosive.<br>'+
    '2. Puis MU <b>assisté</b> (élastique/sauté), assistance qui baisse.<br>'+
    '3. Enfin MU <b>strict à froid</b>, séries courtes et fréquentes.</p></div>';
  if(D.mu.logs.length){
    h += '<div class="card"><div class="muted" style="margin-bottom:6px">Historique</div>';
    D.mu.logs.slice().reverse().forEach(function(l){
      h += '<div class="hist-row"><span class="d">'+fmtDate(l.date)+'</span><span class="v">'+esc(MU_STAGES[l.stage].name)+'</span></div>';
    });
    h += '</div>';
  }
  return h;
}
function setMU(i){
  if(D.mu.stage===i && D.mu.logs.length && D.mu.logs[D.mu.logs.length-1].stage===i) return;
  D.mu.stage = i;
  D.mu.logs.push({date:today(), stage:i});
  save(); render();
  if(i===MU_STAGES.length-1){ beep(); }
}

/* ---- Poids ---- */
function viewPoids(){
  var h = '<div class="card"><div class="muted" style="margin-bottom:10px">Poids de corps du jour</div>'+
    '<div class="bw-add"><input class="inp" id="bwInp" type="number" inputmode="decimal" placeholder="kg">'+
    '<button class="btn primary" onclick="addBW()">Ajouter</button></div>';
  if(D.bw.length){
    var vals=D.bw.map(function(x){return x.kg;});
    h += chartBW(vals);
    var latest=D.bw[D.bw.length-1].kg, first=D.bw[0].kg, delta=(latest-first).toFixed(1);
    h += '<div class="muted">Actuel : <b style="color:var(--ink)">'+latest+' kg</b>'+
      (D.bw.length>1?('  ·  '+(delta>=0?"+":"")+delta+' kg depuis le début'):'')+'</div>';
  } else {
    h += '<div class="muted">Pas encore de mesure.</div>';
  }
  h += '</div>';
  if(D.bw.length){
    h += '<div class="card"><div class="muted" style="margin-bottom:6px">Historique</div>';
    D.bw.slice().reverse().forEach(function(x,ri){
      var realIdx = D.bw.length-1-ri;
      h += '<div class="hist-row"><span class="d">'+fmtDate(x.date)+'</span>'+
        '<span class="v">'+x.kg+' kg <span style="color:var(--faint);cursor:pointer;margin-left:8px" onclick="delBW('+realIdx+')">✕</span></span></div>';
    });
    h += '</div>';
  }
  return h;
}
function addBW(){
  var inp=document.getElementById("bwInp"); var v=Number(inp.value);
  if(!v) return;
  D.bw.push({date:today(), kg:v}); save(); render();
}
function delBW(i){ D.bw.splice(i,1); save(); render(); }
function chartBW(vals){
  if(vals.length<2) return "";
  var w=460,hgt=90,pad=18;
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals); if(mx===mn) mx=mn+1;
  var n=vals.length;
  var xs=function(i){return pad+(w-2*pad)*(i/(n-1));};
  var ys=function(v){return pad+(hgt-2*pad)*(1-(v-mn)/(mx-mn));};
  var line=vals.map(function(v,i){return (i?"L":"M")+xs(i).toFixed(1)+" "+ys(v).toFixed(1);}).join(" ");
  return '<svg class="spark" viewBox="0 0 '+w+' '+hgt+'" preserveAspectRatio="none" style="height:70px">'+
    '<path d="'+line+'" fill="none" stroke="var(--hyp)" stroke-width="2"/></svg>';
}

/* ============ CHRONO ============ */
var timerInt=null, timerLeft=0, timerEnd=0;
function startTimer(sec){
  timerLeft=sec; timerEnd=Date.now()+sec*1000;
  document.getElementById("timer").classList.add("show");
  tickTimer();
  if(timerInt) clearInterval(timerInt);
  timerInt=setInterval(tickTimer,250);
}
function tickTimer(){
  timerLeft=Math.max(0,Math.round((timerEnd-Date.now())/1000));
  document.getElementById("timerT").textContent=fmtRest(timerLeft);
  if(timerLeft<=0){ stopTimer(); beep(); if(navigator.vibrate) navigator.vibrate([180,90,180]); }
}
function stopTimer(){ if(timerInt) clearInterval(timerInt); timerInt=null; document.getElementById("timer").classList.remove("show"); }
document.getElementById("timerStop").onclick=stopTimer;
document.getElementById("timerAdd").onclick=function(){ timerEnd+=30000; tickTimer(); };

var actx=null;
function beep(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    [0,0.18,0.36].forEach(function(t){
      var o=actx.createOscillator(),g=actx.createGain();
      o.frequency.value=880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001,actx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.3,actx.currentTime+t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+t+0.15);
      o.start(actx.currentTime+t); o.stop(actx.currentTime+t+0.16);
    });
  }catch(e){}
}

/* ============ NAV & HELPERS ============ */
function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,""); }
function lastLog(name){ var a=D.logs[name]; return a&&a.length?a[a.length-1]:null; }
function selDay(i){ SEL_DAY=i; TAB="seance"; render(); window.scrollTo(0,0); }
document.querySelectorAll("nav button").forEach(function(b){
  b.onclick=function(){ TAB=b.dataset.tab; render(); window.scrollTo(0,0); };
});

render();
</script>
